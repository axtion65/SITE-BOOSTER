name: PR verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install video assembly runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API server
        run: pnpm --filter @workspace/api-server test

      - name: Test Quae
        run: pnpm --filter @workspace/quae test

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build Quae
        run: pnpm --filter @workspace/quae build

      - name: Check diff formatting
        run: git diff --check

      - name: Verify Railway migration bundle
        run: |
          test -f artifacts/api-server/dist/migrations/0012_website_import_drafts.sql
          cmp \
            lib/db/migrations/0012_website_import_drafts.sql \
            artifacts/api-server/dist/migrations/0012_website_import_drafts.sql
          test -f artifacts/api-server/dist/migrations/0019_video_preparation_lease.sql
          cmp \
            lib/db/migrations/0019_video_preparation_lease.sql \
            artifacts/api-server/dist/migrations/0019_video_preparation_lease.sql
